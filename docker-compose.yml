services:
  api:
    build:
      context: ./backend
    environment:
      MODEL_PATH: /service/models/dfu_final_model.keras
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_DFU_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
